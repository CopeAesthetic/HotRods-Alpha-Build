[mypy]
python_version = 3.9
ignore_missing_imports = True
check_untyped_defs = True
no_implicit_optional = True
show_error_codes = True
# The game stores design data as plain dicts, so a lot of Optional/object
# noise comes from dict access rather than real defects. Keep the checks
# that catch genuine mistakes (missing attributes, bad calls, bad returns).
disable_error_code = index, union-attr, misc, assignment, operator, return-value, arg-type, var-annotated, has-type, no-redef
exclude = (\.venv|build|dist|tools)
